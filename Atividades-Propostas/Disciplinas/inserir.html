<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir materias</title>
    <link rel="stylesheet" href="estilo.css">
</head>
  
<body>
    <div class="container">
        <h1>Cadastro materias</h1>
        <p class="subtitulo">Preencha os dados</p>

        <form id="formInserir">
            <label for="nome" id="labelNome">Nome:</label>
            <input type="text" name="nome" id="nome" required>

            <label for="sigla">Sigla:</label>
            <input type="text" name="sigla" id="sigla" required>
            
            
            <label for="carga">Carga:</label>
            <input type="number" name="carga" id="carga" required>

            <input type="submit" value="Cadastrar">
        </form>

        <p id="mensagem" class="mensagem" style="display: none;"></p>

        <br>
        <div style="text-align: center;">
            <a href="listar.html" style="color: #c2185b; font-weight: bold;">Ver listagem de materias</a> |
            <a href="usuarios.html" style="color: #c2185b; font-weight: bold;">Gerenciar materias</a>
        </div>
    </div>

    <script src="inserir.js"></script>
</body>
</html>
