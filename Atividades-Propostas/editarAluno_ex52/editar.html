<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Alterar Aluno</title>
    <script>
        function BuscarAluno() {
            let matricula = document.getElementById("matricula").value;
            if (matricula == "") {
                document.getElementById("msg").innerHTML = "Informe a matrícula para buscar.";
                return;
            }

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let aluno = JSON.parse(this.responseText);
                    
                    if (aluno && aluno.nome) {
                        document.getElementById("nome").value = aluno.nome;
                        document.getElementById("email").value = aluno.email;
                        document.getElementById("matricula").readOnly = true;
                        document.getElementById("msg").innerHTML = "Aluno encontrado. Altere os dados e clique em Alterar.";
                    } else {
                        document.getElementById("msg").innerHTML = "Aluno não encontrado.";
                    }
                }
            };
            xmlhttp.open("GET", "http://localhost/DAW/Atividades-Propostas/ex52_editarAluno.php?matricula=" + matricula);
            xmlhttp.send();
        }

        function AlterarAluno() {
            let matricula = document.getElementById("matricula").value;
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Chegou a resposta OK: " + this.responseText);
                    document.getElementById("msg").innerHTML = "Aluno alterado com sucesso!";
                } else if (this.readyState < 4) {
                    console.log("Carregando: " + this.readyState);
                } else {
                    console.log("Requisição falhou: " + this.status);
                }
            };


            xmlhttp.open("GET", "http://localhost/3daw/ex52_alterarAluno.php?matricula=" + matricula +
                                "&nome=" + nome + "&email=" + email);
            xmlhttp.send();
        }
    </script>
</head>


<body>
<h1>Alterar Aluno</h1>
<br>
<a href="ex52_IncluirAlunoJS.html">Inserir Aluno</a><br>
<a href="ex52_alterarAluno.html">Alterar Aluno</a><br>
<a href="ex52_listarAlunos.html">Listar Alunos</a><br>
<a href="ex52_excluirAluno.html">Excluir Aluno</a><br>
<a href="ex52_detalheAluno.html">Detalhe de Aluno</a><br>
<br>
<form action="" method="POST" name="formAluno" id="formAluno">
    Matrícula: <input type="text" name="matricula" id="matricula" required>
    <input type="button" value="Buscar" onclick="BuscarAluno();"> <br><br>
    
    Nome: <input type="text" name="nome" id="nome"> <br>
    E-mail: <input type="text" name="email" id="email"> <br>
    <br><br>
    <input type="button" value="Alterar" onclick="AlterarAluno();">
</form>
<p id="msg"></p>
<br>
</body>
</html>
