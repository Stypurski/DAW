<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
    <title>Calculadora aprimorada</title>
    <link rel="stylesheet" href = "style.css">
</head>
<body>
    <div class = "Calculadora">
        
        <label for="x">Primeiro numero: </label>
        <input type="number" id = "x" placeholder = "Primeiro numero:" step= " any">
        
        <label for="sinal">Operacao: </label>
        <select id = "sinal">
            <option value = "+"> + </option>
            <option value = "-"> - </option>
            <option value = "/"> / </option>
            <option value = "*"> * </option>
        </select>
        
        <label for="y">Segundo numero: </label>
        <input type = "number" id = "y" placeholder = "Segundo numero" step = "any">
        
        <button onclick= "Calcular()">Calcular </button>
        
        <div class= "result" id="resultado">Resultado ainda não existe</div>
    </div>
    
    <script src="jvScript.js"></script>
</body>
